[package]
name = "exception-collector"
description = "全项目组异常收集系统：自动捕获 panic、error 日志和 Result::Err，支持 GitHub Issue 共建上报和自研平台批量上报"
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
authors = ["TokenFleet AI <baoyx19870908@gmail.com>"]
license = "Apache-2.0"
repository = "https://github.com/TokenFleet-AI/exception-collector"
homepage = "https://github.com/TokenFleet-AI/exception-collector"
documentation = "https://docs.rs/exception-collector"
readme = "README.md"
keywords = ["exception", "error-collector", "panic", "github-issue", "tracing"]
categories = ["development-tools::debugging"]
publish = true

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "time", "process"] }
dashmap = "6"
tracing = "0.1"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
async-trait = "0.1"
toml = "0.8"
sha2 = "0.10"
rusqlite = { version = "0.32", features = ["bundled"] }
regex = "1"
which = "7"
dirs = "6"
ureq = { version = "2", features = ["json"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"], optional = true }

[dev-dependencies]
tempfile = "3"

[features]
default = []
http-llm = ["dep:reqwest"]
testing = []

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
missing_debug_implementations = "warn"
